<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cdd9ec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="겸율휘연">
<title>겸율휘연, 행복한 우리가족 액티비티</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 폰트를 렌더링 차단 없이 로드: 화면은 즉시 그려지고, 폰트는 준비되는 대로 자연스럽게 교체 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap"></noscript>
<style>
  :root{
    --font-body:'Gowun Batang','Apple SD Gothic Neo','Malgun Gothic',serif;
    --font-head:'Gowun Batang','Apple SD Gothic Neo',serif;
    --ink:#20242e; --muted:#6b7280; --brand:#3b6fe0; --brand2:#f2a53c;
    --green:#12a06a; --red:#e0564b; --amber-bg:#ffe2b8; --amber-tx:#c47a12;
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.72);
    --line:rgba(255,255,255,.65); --hair:rgba(120,130,150,.18);
    --shadow:0 10px 30px rgba(80,100,140,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font-body);
    color:var(--ink);min-height:100vh;
    background:linear-gradient(160deg,#bcd3ef 0%,#dfe6f0 42%,#f3ead6 100%);
    background-attachment:fixed;-webkit-text-size-adjust:100%;
    padding:0 0 40px;
  }
  /* 배경 은은한 컬러 블롭 */
  .blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0;pointer-events:none}
  .blob.b1{width:280px;height:280px;background:#9dc0f0;top:-60px;left:-70px}
  .blob.b2{width:300px;height:300px;background:#f4cf8f;bottom:-80px;right:-80px}
  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 16px}
  /* 다정한 느낌의 제목/숫자용 폰트 */
  .top .title,.hero .big,.tile .n,h2.sec,.pill{font-family:var(--font-head);font-weight:700}

  .glass{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
  .card{margin-bottom:14px;padding:18px}

  /* 헤더 */
  .top{padding:22px 6px 12px;display:flex;align-items:center;justify-content:space-between}
  .top .title{font-size:clamp(15px,4.6vw,22px);font-weight:800;letter-spacing:-.5px;line-height:1.25;flex:1;padding-right:12px}
  .top .logo{width:38px;height:38px;border-radius:12px;background:#1b1f2a;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}

  /* 히어로 */
  .hero{padding:20px}
  .hero .lab{font-size:12.5px;color:var(--muted);font-weight:600}
  .hero .big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:6px 0 8px;
    display:flex;align-items:baseline;gap:6px}
  .hero .big small{font-size:18px;font-weight:700;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:4px;background:var(--amber-bg);color:var(--amber-tx);
    font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px}
  .hero .sub{margin-top:12px;font-size:12.5px;color:var(--muted);
    background:var(--glass-strong);display:inline-block;padding:6px 12px;border-radius:999px}

  /* 탭 */
  nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--glass);color:var(--muted);
    padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  nav.tabs button.active{background:#1b1f2a;color:#fff;border-color:#1b1f2a}
  nav.tabs button.add{color:var(--brand);border-style:dashed}

  h2.sec{margin:0 0 14px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:7px}
  h2.sec .r{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}

  /* 폼 */
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
  input,select{width:100%;padding:13px 13px;border:1px solid var(--hair);border-radius:13px;font-size:16px;
    background:rgba(255,255,255,.7);color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--brand);background:#fff}
  .row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .full{margin-bottom:12px}
  .btn{background:#1b1f2a;color:#fff;border:none;padding:14px 16px;border-radius:14px;font-size:15.5px;
    font-weight:800;cursor:pointer;width:100%}
  .btn:active{transform:translateY(1px)}
  .btn-soft{background:var(--glass-strong);color:var(--ink);border:1px solid var(--line)}
  .btn-sm{width:auto;padding:9px 14px;font-size:13px;border-radius:11px}
  .btn-blue{background:var(--brand)}

  /* 타일 */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--glass-strong);border:1px solid var(--line);border-radius:16px;padding:14px}
  .tile .n{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .tile .l{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600}
  .tile.blue .n{color:var(--brand)} .tile.gold .n{color:var(--brand2)}

  /* 달력 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-nav{background:var(--glass-strong);border:1px solid var(--line);border-radius:11px;width:36px;height:36px;
    font-size:19px;cursor:pointer;color:var(--ink);line-height:1;display:flex;align-items:center;justify-content:center}
  .cal-nav:active{transform:scale(.94)}
  .cal-title{font-weight:800;font-size:15.5px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-w{text-align:center;font-size:11px;padding:2px 0;font-weight:700}
  .cal-d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;font-size:13.5px;gap:3px;position:relative}
  .cal-d.pad{visibility:hidden}
  .cal-d.on{background:rgba(59,111,224,.14);cursor:pointer;font-weight:800}
  .cal-d.on:active{transform:scale(.93)}
  .cal-d.today{outline:2px solid var(--brand);outline-offset:-2px}
  .cal-d.sel{background:var(--brand);color:#fff!important}
  .cal-d .dots{display:flex;gap:2px;height:5px;align-items:center}

  /* 구성원 리스트 (이미지 코인리스트 스타일) */
  .mrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--hair)}
  .mrow:last-child{border-bottom:none}
  .init{width:42px;height:42px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;color:#fff;font-weight:800;font-size:16px}
  .mmeta{flex:1;min-width:0}
  .mname{font-size:15px;font-weight:700}
  .msub{font-size:12px;color:var(--muted);margin-top:2px}
  .mval{text-align:right;flex:0 0 auto}
  .mval .v1{font-size:15px;font-weight:800}
  .mval .v2{font-size:11.5px;color:var(--muted);margin-top:2px}

  /* 용돈 */
  .allow{border:1px solid var(--line);background:var(--glass-strong);border-radius:16px;padding:14px;margin-bottom:11px}
  .allow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .allow-name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
  .chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800}
  .chip.a{background:var(--amber-bg);color:var(--amber-tx)}
  .chip.g{background:#d9f2e6;color:var(--green)}
  .prog{height:9px;background:rgba(120,130,150,.18);border-radius:999px;overflow:hidden;margin:8px 0}
  .prog i{display:block;height:100%;border-radius:999px}
  .astats{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
  .astats b{color:var(--ink);font-size:13.5px}
  .aact{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}

  /* 기록 리스트 */
  .item{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--hair)}
  .item:last-child{border-bottom:none}
  .dot{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;color:#fff;font-weight:800;font-size:14px}
  .item .meta{flex:1;min-width:0}
  .item .meta .t{font-size:14px;font-weight:700}
  .item .meta .s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .amt{font-weight:800;font-size:14px;color:var(--green)}
  .del{background:none;border:none;color:var(--red);font-size:12.5px;cursor:pointer;padding:6px;font-weight:700}
  .del.edit{color:var(--brand)}
  /* 러닝 기록 필터 + 스크롤 */
  .rfilter{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .rfilter::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;border:1px solid var(--hair);background:var(--glass-strong);border-radius:999px;
    padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--ink);line-height:1}
  .rchip:active{transform:scale(.95)}
  .rchip .rc{font-size:10.5px;font-weight:800;opacity:.6}
  .rchip.on .rc{opacity:.95}
  .rsum{font-size:12.5px;color:var(--muted);margin:0 2px 8px}
  .rsum b{color:var(--ink);font-size:14px}
  .reclist{max-height:min(600px,62vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .reclist::-webkit-scrollbar{width:6px}
  .reclist::-webkit-scrollbar-thumb{background:rgba(120,130,150,.3);border-radius:999px}
  .rmonth{position:sticky;top:0;background:rgba(244,246,251,.94);backdrop-filter:blur(4px);
    font-size:11px;font-weight:800;color:var(--muted);padding:7px 4px 5px;z-index:2;letter-spacing:.2px}
  .pstats{display:flex;gap:7px;margin:2px 2px 12px}
  .pstat{flex:1;background:var(--glass-strong);border:1px solid var(--line);border-radius:13px;padding:9px 5px;
    text-align:center;font-size:10.5px;color:var(--muted);font-weight:600}
  .pstat b{display:block;font-size:14px;color:var(--ink);margin-top:3px;font-weight:800}
  .chip.badge{background:#fff0d0;color:#c47a12;font-size:10px}
  /* 맨 위로 버튼 (반투명 화이트) */
  .gotop{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);
    width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.5);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);
    box-shadow:0 6px 20px rgba(80,100,140,.25);display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#1b1f2a;cursor:pointer;opacity:0;pointer-events:none;transition:.28s;z-index:56;font-weight:700}
  .gotop.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .gotop:active{transform:translateX(-50%) scale(.92)}
  .muted{color:var(--muted);font-size:12.5px}
  .empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:13px}
  .foot{display:flex;gap:8px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1b1f2a;color:#fff;
    padding:12px 20px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.show{opacity:1}
  /* 사용자 칩 / 로그인 */
  #userchip{flex:0 0 auto}
  .uchip{display:flex;align-items:center;gap:6px;background:var(--glass-strong);border:1px solid var(--line);
    border-radius:999px;padding:4px 9px 4px 5px;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
  .uav{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;flex:0 0 auto}
  .login-wrap{max-width:430px;margin:5vh auto 0;text-align:center;padding:0 4px}
  .login-wrap h2{font-size:20px;font-weight:800;margin:0 0 4px}
  .login-wrap p{color:var(--muted);font-size:13px;margin:0 0 22px}
  .profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .pfbtn{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 6px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;backdrop-filter:blur(10px)}
  .pfbtn:active{transform:scale(.96)}
  .pfav{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800}
  .pfname{font-size:14px;font-weight:800}
  .pfrole{font-size:10.5px;color:var(--muted)}
  .pinbox{max-width:290px;margin:0 auto}
  .pindots{display:flex;justify-content:center;gap:14px;margin:20px 0 24px}
  .pindot{width:15px;height:15px;border-radius:50%;border:2px solid var(--brand)}
  .pindot.on{background:var(--brand)}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .pinkey{background:var(--glass-strong);border:1px solid var(--line);border-radius:16px;padding:15px 0;font-size:22px;
    font-weight:800;cursor:pointer;color:var(--ink)}
  .pinkey:active{transform:scale(.94);background:#fff}
  .pinkey.fn{font-size:13px;font-weight:700;color:var(--muted)}
  .shake{animation:shk .3s}
  @keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  /* 탭 배지 */
  .tabbadge{background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:0 6px;margin-left:5px}
  /* 미션 */
  .mi{background:var(--glass-strong);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px}
  .mi.overdue{border-color:#f2b8b0;background:rgba(255,244,242,.75)}
  .mi-top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .mi-title{font-size:14.5px;font-weight:800;flex:1}
  .mi-crit{font-size:12.5px;color:var(--muted);margin:3px 0 7px;line-height:1.4}
  .mi-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .mi-meta .od{color:var(--red);font-weight:800}
  .mi-act{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .st{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;flex:0 0 auto}
  .st.assigned{background:#e7edfb;color:var(--brand)}
  .st.submitted{background:var(--amber-bg);color:var(--amber-tx)}
  .st.approved{background:#d9f2e6;color:var(--green)}
  .st.rejected{background:#fde0dc;color:var(--red)}
  .chk{display:flex;flex-wrap:wrap;gap:8px}
  .chkbtn{border:1px solid var(--line);background:var(--glass-strong);border-radius:12px;padding:9px 12px;cursor:pointer;
    font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;color:var(--ink)}
  .chkbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chkbox{width:17px;height:17px;border-radius:5px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
  .dash{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .dcard{background:var(--glass-strong);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
  .dcard .dn{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
  .dcard .drow{display:flex;gap:12px;margin-top:9px}
  .dcard .dcol{flex:1;text-align:center}
  .dcard .dcol .dv{font-size:19px;font-weight:800}
  .dcard .dcol .dl{font-size:10.5px;color:var(--muted);margin-top:1px}
  .msec{font-size:12.5px;font-weight:800;color:var(--muted);margin:4px 2px 9px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>

<div class="app">
  <div class="top">
    <div class="title">💕 겸율휘연, 행복한 우리가족 액티비티 💕</div>
    <div id="userchip"></div>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>
<button class="gotop" id="gotop" aria-label="맨 위로">↑</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== 데이터 (Supabase 온라인 저장소 · 가족 6명 실시간 공유) ===== */
const SB_URL='https://idirufpmoctheoxttujg.supabase.co';
const SB_KEY='sb_publishable_oFCebfYGRI13G3eDxpHRqw_Cc9MWg9l';
const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
const CHILD_UNIT=5, RUNS_PER_PAY=3, PAY_AMOUNT=10000;

function seed(){
  return {
    members:[
      {id:'m1',name:'아빠',child:false,unit:5},{id:'m2',name:'엄마',child:false,unit:5},
      {id:'m3',name:'정재겸',child:true,unit:5},{id:'m4',name:'정재율',child:true,unit:5},
      {id:'m5',name:'정재휘',child:true,unit:5},{id:'m6',name:'정재연',child:true,unit:3},
    ],
    activities:[{id:'running',name:'러닝',type:'running'},{id:'mission',name:'미션',type:'mission'}],
    runs:[], generic:{}, payouts:{},
    missions:[],
    pins:{m1:'0000',m2:'9999',m3:'1111',m4:'2222',m5:'3333',m6:'4444'},
  };
}
// 기존 데이터에 미션 관련 항목이 없으면 채워 넣기(마이그레이션)
function normalize(){
  let changed=false;
  if(!state.missions){state.missions=[];changed=true;}
  if(!state.pins){state.pins={m1:'0000',m2:'9999',m3:'1111',m4:'2222',m5:'3333',m6:'4444'};changed=true;}
  if(!state.activities.some(a=>a.id==='mission')){state.activities.splice(1,0,{id:'mission',name:'미션',type:'mission'});changed=true;}
  return changed;
}
let state=seed();               // 로딩 전 임시 값 (init에서 실제 공유 데이터로 교체)
let _saving=false, _pending=false, _lastJSON='', _pendingRender=false;

async function pushState(){     // 현재 상태를 서버에 저장
  if(!sb) return;
  const json=JSON.stringify(state); _lastJSON=json;
  const {error}=await sb.from('app_state').update({data:state,updated_at:new Date().toISOString()}).eq('id',1);
  if(error) console.warn('저장 오류',error);
}
function save(){                // 로컬은 이미 갱신됨 → 백그라운드로 서버 반영(연속 저장은 합쳐 처리)
  if(_saving){ _pending=true; return; }
  _saving=true;
  pushState().finally(()=>{ _saving=false; if(_pending){ _pending=false; save(); } });
}
function applyServer(data){     // 서버(다른 가족)의 변경을 내 화면에 반영
  if(!data||!data.members) return;
  const json=JSON.stringify(data);
  if(json===JSON.stringify(state)) return;   // 변화 없음
  state=data;
  if(json===_lastJSON) return;               // 내가 방금 저장한 것의 메아리 → 조용히 동기화
  const ae=document.activeElement;
  if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)){ _pendingRender=true; return; } // 입력 중이면 방해 안 함
  render();
}
async function init(){
  render();                     // 임시(빈) 화면 즉시 표시
  if(!sb){ toast('온라인 저장소 연결에 실패했어요 (네트워크 확인)'); return; }
  try{
    const {data}=await sb.from('app_state').select('data').eq('id',1).single();
    if(data&&data.data&&data.data.members) state=data.data;
    else { state=seed(); await pushState(); }   // 최초 1회 초기 데이터 심기
    if(normalize()) await pushState();           // 미션·PIN 항목 보강
  }catch(e){ console.warn('불러오기 오류',e); toast('데이터 서버 연결을 확인해 주세요'); }
  render();
  sb.channel('app_state_rt')    // 실시간: 누가 바꾸면 즉시 반영
    .on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'id=eq.1'},p=>applyServer(p.new&&p.new.data))
    .subscribe();
  setInterval(async()=>{        // 보조: 12초마다 최신 상태 확인(실시간이 끊겨도 동기화 보장)
    try{ const {data}=await sb.from('app_state').select('data').eq('id',1).single(); if(data) applyServer(data.data);}catch(e){}
  },12000);
  document.addEventListener('focusout',()=>{ if(_pendingRender){_pendingRender=false; setTimeout(render,120);} });
}

const COLORS=['#3b6fe0','#12a06a','#f2a53c','#db2777','#0891b2','#7c3aed'];
function colorOf(id){const i=state.members.findIndex(m=>m.id===id);return COLORS[(i<0?0:i)%COLORS.length];}
function member(id){return state.members.find(m=>m.id===id);}
function unitOf(id){const m=member(id);return (m&&m.unit)?m.unit:CHILD_UNIT;} // 아이별 용돈 인정 최소 거리(재연 3km)
function uid(){return Math.random().toString(36).slice(2,9);}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDate(s){const[y,m,d]=s.split('-');return `${Number(m)}월 ${Number(d)}일`;}
function fmtKm(v){return (Math.round(v*10)/10).toLocaleString();}
function fmtWon(v){return v.toLocaleString()+'원';}
function initial(n){return n.length>=3?n.slice(-1):n.slice(0,1);} // 정재겸→겸, 아빠→아
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1900);}

let current='running';
let calYM=null, calSel=null;  // 달력 표시 월 / 선택 날짜
let editId=null;              // 수정 중인 기록 id
let recentFilter='all';       // 러닝 기록 사람 필터 (전체/구성원id)
let session=(function(){try{return localStorage.getItem('familySession')||null;}catch(e){return null;}})(); // 로그인한 사람(폰별 유지)
let loginSel=null, loginPin=''; // 로그인 화면 상태
let dashRange='month';        // 대시보드 기간: week|month|all
let mDraft=null;              // 미션 부여 폼 초안 { title, criteria, due, ids[] }
function isParent(id){const m=member(id);return m&&!m.child;}
function curUser(){return session?member(session):null;}

/* ===== 탭 ===== */
function renderTabs(){
  const nav=document.getElementById('tabs');nav.innerHTML='';
  state.activities.forEach(a=>{
    const b=document.createElement('button');
    const emo=a.type==='running'?'🏃 ':(a.type==='mission'?'🎯 ':'⭐ ');
    b.innerHTML=emo+a.name+(a.type==='mission'?missionBadge():'');
    b.className=current===a.id?'active':'';
    b.onclick=()=>{current=a.id;render();window.scrollTo({top:0});};
    nav.appendChild(b);
  });
  if(isParent(session)){
    const add=document.createElement('button');
    add.textContent='＋ 액티비티 추가';add.className='add';add.onclick=addActivity;
    nav.appendChild(add);
  }
}
function missionBadge(){
  const me=curUser(); if(!me) return '';
  const n = me.child
    ? state.missions.filter(x=>x.assigneeId===me.id && (x.status==='assigned'||x.status==='rejected')).length
    : state.missions.filter(x=>x.status==='submitted').length;
  return n>0?`<span class="tabbadge">${n}</span>`:'';
}
function addActivity(){
  const name=prompt('추가할 액티비티 이름을 입력하세요 (예: 등산, 독서, 수영)');
  if(!name)return;
  const id='act_'+uid();
  state.activities.push({id,name:name.trim(),type:'generic'});
  state.generic[id]=[];current=id;save();render();
  toast(`'${name}' 메뉴를 추가했어요`);
}

/* ===== 메인 ===== */
function render(){
  if(!session || !member(session)){ renderLogin(); return; }
  renderHeaderUser();
  renderTabs();
  const act=state.activities.find(a=>a.id===current)||state.activities[0];
  if(act.type==='running') renderRunning();
  else if(act.type==='mission') renderMission();
  else renderGeneric(act);
}

/* ===== 로그인 (프로필 + PIN) ===== */
function renderHeaderUser(){
  const box=document.getElementById('userchip'); if(!box) return;

function logout(){ session=null; try{localStorage.removeItem('familySession');}catch(e){} loginSel=null;loginPin=''; current='running'; render(); }
function renderLogin(){
  const uc=document.getElementById('userchip'); if(uc) uc.innerHTML='';
  document.getElementById('tabs').innerHTML='';
  const v=document.getElementById('view'); v.innerHTML='';
  const wrap=document.createElement('div'); wrap.className='login-wrap';
  if(!loginSel){
    wrap.appendChild(el(`<div><h2>누구세요?</h2><p>프로필을 고르고 PIN을 입력하세요</p></div>`));
    const grid=document.createElement('div'); grid.className='profiles';
    state.members.forEach(m=>{
      const btn=document.createElement('button'); btn.className='pfbtn';
      btn.innerHTML=`<span class="pfav" style="background:${colorOf(m.id)}">${initial(m.name)}</span>
        <span class="pfname">${m.name}</span><span class="pfrole">${m.child?'아이':'부모'}</span>`;
      btn.onclick=()=>{loginSel=m.id;loginPin='';render();};
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);
  } else {
    const m=member(loginSel);
    wrap.appendChild(el(`<div><h2>${m.name}</h2><p>PIN 4자리를 입력하세요</p></div>`));
    const box=document.createElement('div'); box.className='pinbox';
    box.appendChild(el(`<div class="pindots">${[0,1,2,3].map(i=>`<span class="pindot ${i<loginPin.length?'on':''}"></span>`).join('')}</div>`));
    const pad=document.createElement('div'); pad.className='pinpad';
    [['1'],['2'],['3'],['4'],['5'],['6'],['7'],['8'],['9'],['back','⌫'],['0'],['prev','뒤로']].forEach(k=>{
      const key=k[0];
      const b=document.createElement('button');
      b.className='pinkey'+((key==='back'||key==='prev')?' fn':'');
      b.textContent=k[1]||key;
      b.onclick=()=>{
        if(key==='back'){loginPin=loginPin.slice(0,-1);render();}
        else if(key==='prev'){loginSel=null;loginPin='';render();}
        else if(loginPin.length<4){ loginPin+=key; if(loginPin.length===4) tryLogin(m.id,loginPin); else render(); }
      };
      pad.appendChild(b);
    });
    box.appendChild(pad);
    wrap.appendChild(box);
  }
  v.appendChild(wrap);
}
function tryLogin(id,pin){
  if((state.pins[id]||'')===pin){
    session=id; try{localStorage.setItem('familySession',id);}catch(e){}
    loginSel=null;loginPin=''; current='running'; render(); toast(`${member(id).name}님 환영해요!`);
  } else {
    loginPin=''; render();
    const w=document.querySelector('.pinbox'); if(w){w.classList.add('shake');setTimeout(()=>w.classList.remove('shake'),320);}
    toast('PIN이 맞지 않아요');
  }
}

/* ===== 미션 ===== */
function renderMission(){
  const v=document.getElementById('view'); v.innerHTML='';
  const me=curUser(); const kids=state.members.filter(m=>m.child);
  // 대시보드
  const now=new Date(), tS=todayStr();
  const inRange=ds=>{
    if(dashRange==='all') return true;
    if(!ds) return false;
    if(dashRange==='month') return ds.slice(0,7)===tS.slice(0,7);
    const diff=(now-new Date(ds+'T00:00:00'))/86400000; return diff>=0&&diff<7; // 최근 7일
  };
  const dash=document.createElement('div'); dash.className='glass card';
  dash.appendChild(el(`<h2 class="sec" style="justify-content:space-between"><span>📊 미션 대시보드</span>
    <span class="seg">
      <button data-r="week" class="${dashRange==='week'?'on':''}">주간</button>
      <button data-r="month" class="${dashRange==='month'?'on':''}">월간</button>
      <button data-r="all" class="${dashRange==='all'?'on':''}">전체</button>
    </span></h2>`));
  const dgrid=document.createElement('div'); dgrid.className='dash';
  kids.forEach(k=>{
    const ms=state.missions.filter(x=>x.assigneeId===k.id && inRange(x.createdAt));
    const assigned=ms.length, done=ms.filter(x=>x.status==='approved').length;
    const c=colorOf(k.id);
    dgrid.appendChild(el(`<div class="dcard">
      <div class="dn"><span class="uav" style="width:22px;height:22px;border-radius:8px;background:${c}">${initial(k.name)}</span>${k.name}</div>
      <div class="drow">
        <div class="dcol"><div class="dv" style="color:${c}">${assigned}</div><div class="dl">부여</div></div>
        <div class="dcol"><div class="dv" style="color:var(--green)">${done}</div><div class="dl">완료</div></div>
        <div class="dcol"><div class="dv">${assigned-done}</div><div class="dl">진행중</div></div>
      </div></div>`));
  });
  dash.appendChild(dgrid);
  v.appendChild(dash);
  dash.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{dashRange=b.getAttribute('data-r');render();});

  if(!me.child) renderMissionParent(v, me, kids);
  else renderMissionChild(v, me);
}
function renderMissionParent(v, me, kids){
  if(!mDraft) mDraft={title:'',criteria:'',due:todayStr(),ids:[]};
  const form=document.createElement('div'); form.className='glass card';
  form.appendChild(el(`<h2 class="sec">✍️ 미션 부여</h2>`));
  form.appendChild(el(`<label>대상자 (여러 명 선택 가능)</label>`));
  const chk=document.createElement('div'); chk.className='chk'; chk.style.marginBottom='12px';
  kids.forEach(k=>{
    const on=mDraft.ids.includes(k.id);
    const b=document.createElement('button'); b.className='chkbtn'+(on?' on':'');
    b.innerHTML=`<span class="chkbox">${on?'✓':''}</span>${k.name}`;
    b.onclick=()=>{ mDraft.ids=on?mDraft.ids.filter(x=>x!==k.id):mDraft.ids.concat(k.id); render(); };
    chk.appendChild(b);
  });
  form.appendChild(chk);
  const body=el(`<div>
    <div class="full"><label>미션 내용</label><input type="text" id="m_title" placeholder="예: 방 정리하기" value="${(mDraft.title||'').replace(/"/g,'&quot;')}"></div>
    <div class="full"><label>완료 기준</label><input type="text" id="m_crit" placeholder="예: 책상·바닥 정리 후 사진 확인" value="${(mDraft.criteria||'').replace(/"/g,'&quot;')}"></div>
    <div class="full"><label>마감일</label><input type="date" id="m_due" value="${mDraft.due}"></div>
    <button class="btn" id="m_add">미션 부여하기</button></div>`);
  form.appendChild(body);
  v.appendChild(form);
  form.querySelector('#m_title').oninput=e=>mDraft.title=e.target.value;
  form.querySelector('#m_crit').oninput=e=>mDraft.criteria=e.target.value;
  form.querySelector('#m_due').oninput=e=>mDraft.due=e.target.value;
  form.querySelector('#m_add').onclick=()=>{
    const title=(mDraft.title||'').trim(), crit=(mDraft.criteria||'').trim(), due=mDraft.due;
    if(!mDraft.ids.length){toast('대상자를 선택해 주세요');return;}
    if(!title){toast('미션 내용을 입력해 주세요');return;}
    if(!crit){toast('완료 기준을 입력해 주세요');return;}
    if(!due){toast('마감일을 정해 주세요');return;}
    mDraft.ids.forEach(kid=>state.missions.push({id:uid(),title,criteria:crit,assigneeId:kid,assignerId:me.id,dueDate:due,createdAt:todayStr(),status:'assigned',submittedAt:null,approvedAt:null}));
    const n=mDraft.ids.length; mDraft=null; save(); render(); toast(`미션을 ${n}명에게 부여했어요`);
  };
  // 승인 대기
  const pend=state.missions.filter(x=>x.status==='submitted').sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
  const s1=document.createElement('div'); s1.className='glass card';
  s1.appendChild(el(`<h2 class="sec">⏳ 승인 대기 <span class="r">${pend.length}건</span></h2>`));
  if(!pend.length) s1.appendChild(el(`<div class="empty">승인 대기 중인 미션이 없어요.</div>`));
  else pend.forEach(x=>s1.appendChild(missionCard(x,'parent')));
  v.appendChild(s1);
  // 진행 중
  const prog=state.missions.filter(x=>x.status==='assigned'||x.status==='rejected').sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
  const s2=document.createElement('div'); s2.className='glass card';
  s2.appendChild(el(`<h2 class="sec">📋 진행 중 <span class="r">${prog.length}건</span></h2>`));
  if(!prog.length) s2.appendChild(el(`<div class="empty">진행 중인 미션이 없어요.</div>`));
  else prog.forEach(x=>s2.appendChild(missionCard(x,'parent')));
  v.appendChild(s2);
  // 완료
  const done=state.missions.filter(x=>x.status==='approved').sort((a,b)=>(b.approvedAt||'').localeCompare(a.approvedAt||''));
  if(done.length){
    const s3=document.createElement('div'); s3.className='glass card';
    s3.appendChild(el(`<h2 class="sec">✅ 완료 <span class="r">최근 ${Math.min(done.length,20)}건</span></h2>`));
    done.slice(0,20).forEach(x=>s3.appendChild(missionCard(x,'parent')));
    v.appendChild(s3);
  }
}
function renderMissionChild(v, me){
  const mine=state.missions.filter(x=>x.assigneeId===me.id);
  const todo=mine.filter(x=>x.status==='assigned'||x.status==='rejected').sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
  const wait=mine.filter(x=>x.status==='submitted');
  const done=mine.filter(x=>x.status==='approved').sort((a,b)=>(b.approvedAt||'').localeCompare(a.approvedAt||''));
  const s1=document.createElement('div');s1.className='glass card';
  s1.appendChild(el(`<h2 class="sec">🎯 해야 할 미션 <span class="r">${todo.length}건</span></h2>`));
  if(!todo.length) s1.appendChild(el(`<div class="empty">지금 해야 할 미션이 없어요. 잘하고 있어요! 👍</div>`));
  else todo.forEach(x=>s1.appendChild(missionCard(x,'child')));
  v.appendChild(s1);
  if(wait.length){
    const s2=document.createElement('div');s2.className='glass card';
    s2.appendChild(el(`<h2 class="sec">⏳ 승인 기다리는 중 <span class="r">${wait.length}건</span></h2>`));
    wait.forEach(x=>s2.appendChild(missionCard(x,'child')));
    v.appendChild(s2);
  }
  if(done.length){
    const s3=document.createElement('div');s3.className='glass card';
    s3.appendChild(el(`<h2 class="sec">✅ 완료한 미션 <span class="r">${done.length}건</span></h2>`));
    done.slice(0,20).forEach(x=>s3.appendChild(missionCard(x,'child')));
    v.appendChild(s3);
  }
}
function missionCard(x, viewer){
  const kid=member(x.assigneeId); const c=colorOf(x.assigneeId);
  const overdue=(x.status==='assigned'||x.status==='rejected') && x.dueDate && x.dueDate<todayStr();
  const stLabel={assigned:'부여됨',submitted:'완료 요청',approved:'완료',rejected:'반려됨'}[x.status]||'';
  const card=document.createElement('div'); card.className='mi'+(overdue?' overdue':'');
  card.innerHTML=`
    <div class="mi-top">
      <span class="uav" style="width:24px;height:24px;border-radius:8px;background:${c}">${initial(kid?kid.name:'?')}</span>
      <span class="mi-title">${x.title}</span>
      <span class="st ${x.status}">${stLabel}</span>
    </div>
    <div class="mi-crit">✔ ${x.criteria}</div>
    <div class="mi-meta"><span>대상 ${kid?kid.name:'?'}</span><span class="${overdue?'od':''}">마감 ${fmtDate(x.dueDate)}${overdue?' · 지남':''}</span></div>`;
  const act=document.createElement('div'); act.className='mi-act';
  if(viewer==='child'){
    if(x.status==='assigned'||x.status==='rejected'){
      const b=el(`<button class="btn btn-sm btn-blue">완료했어요 ✋</button>`);
      b.onclick=()=>{x.status='submitted';x.submittedAt=todayStr();save();render();toast('완료 요청을 보냈어요!');};
      act.appendChild(b);
    }
  } else {
    if(x.status==='submitted'){
      const ok=el(`<button class="btn btn-sm btn-blue">승인</button>`);
      ok.onclick=()=>{x.status='approved';x.approvedAt=todayStr();save();render();toast('승인했어요 👏');};
      const no=el(`<button class="btn btn-sm btn-soft">반려</button>`);
      no.onclick=()=>{x.status='rejected';x.submittedAt=null;save();render();toast('반려했어요 (아이가 다시 수행)');};
      act.appendChild(ok);act.appendChild(no);
    }
    if(x.status==='assigned'||x.status==='rejected'){
      const del=el(`<button class="del">삭제</button>`);
      del.onclick=()=>{if(confirm('이 미션을 삭제할까요?')){state.missions=state.missions.filter(y=>y.id!==x.id);save();render();}};
      act.appendChild(del);
    }
  }
  if(act.children.length) card.appendChild(act);
  return card;
}

    if(!distance||distance<=0){toast('거리를 올바르게 입력해 주세요');return;}
    if(edit){edit.date=date;edit.memberId=memberId;edit.distance=distance;edit.memo=memo;editId=null;save();render();toast('기록을 수정했어요');}
    else{state.runs.push({id:uid(),date,memberId,distance,memo});save();render();toast(`${member(memberId).name} · ${fmtKm(distance)}km 기록 완료!`);}
  };
  if(edit){form.querySelector('#f_cancel').onclick=()=>{editId=null;render();};}

  /* 우리 가족 러너들 : 올해 횟수·거리 + 이번 달 */
  const per=document.createElement('div');
  per.className='glass card';
  per.innerHTML=`<h2 class="sec">👨‍👩‍👧‍👦 우리 가족 러너들 <span class="r">올해 · 이번 달</span></h2>`;
  state.members.forEach(m=>{
    const yr_=state.runs.filter(r=>r.memberId===m.id&&inYear(r));
    const mo_=state.runs.filter(r=>r.memberId===m.id&&inMonth(r));
    const yc=yr_.length, yk=yr_.reduce((s,r)=>s+r.distance,0);
    const mc=mo_.length, mk=mo_.reduce((s,r)=>s+r.distance,0);
    const c=colorOf(m.id);
    const row=document.createElement('div');
    row.className='mrow';
    row.innerHTML=`
      <span class="init" style="background:${c}">${initial(m.name)}</span>
      <div class="mmeta">
        <div class="mname">${m.name}</div>
        <div class="msub">올해 ${yc}회 · ${fmtKm(yk)}km</div>
      </div>
      <div class="mval">
        <div class="v1">${mc}회</div>
        <div class="v2">이번 달 ${fmtKm(mk)}km</div>
      </div>`;
    per.appendChild(row);
  });
  v.appendChild(per);

  /* 입력/수정 폼은 러너들 아래에 배치 */
  v.appendChild(form);
  if(edit) form.scrollIntoView({behavior:'smooth',block:'center'});

  renderAllowance(v);

  /* 러닝 기록 (사람별 필터 + 고정 높이 스크롤) */
  const list=document.createElement('div');list.className='glass card';
  list.appendChild(el(`<h2 class="sec">📅 러닝 기록</h2>`));
  // 필터 칩: 전체 + 구성원별 (건수 표시)
  const fbar=document.createElement('div');fbar.className='rfilter';
  const chips=[{id:'all',label:'전체',cnt:state.runs.length,color:'#1b1f2a'}]
    .concat(state.members.map(m=>({id:m.id,label:initial(m.name),cnt:state.runs.filter(r=>r.memberId===m.id).length,color:colorOf(m.id)})));
  chips.forEach(ch=>{
    const b=document.createElement('button');
    b.className='rchip'+(recentFilter===ch.id?' on':'');
    if(recentFilter===ch.id) b.style.cssText=`background:${ch.color};color:#fff;border-color:${ch.color}`;
    b.innerHTML=`${ch.label}<span class="rc">${ch.cnt}</span>`;
    b.onclick=()=>{recentFilter=ch.id;render();};
    fbar.appendChild(b);
  });
  list.appendChild(fbar);
  // 선택 인원 요약
  const filtered=[...state.runs].filter(r=>recentFilter==='all'||r.memberId===recentFilter)
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const fkm=filtered.reduce((s,r)=>s+r.distance,0);
  const fname=recentFilter==='all'?'전체':((member(recentFilter)||{}).name||'전체');
  list.appendChild(el(`<div class="rsum">${fname} <b>${filtered.length}회</b> · <b>${fmtKm(fkm)}km</b></div>`));
  // 개인 선택 시 상세 요약 (최장·평균·이번 달·최長 연속)
  if(recentFilter!=='all' && filtered.length){
    const longest=filtered.reduce((mx,r)=>Math.max(mx,r.distance),0);
    const avg=fkm/filtered.length;
    const now=new Date(),yr=now.getFullYear(),mo=now.getMonth()+1;
    const inYM=(rr,Y,M)=>{const[y2,m2]=rr.date.split('-').map(Number);return y2===Y&&m2===M;};
    const thisMo=filtered.filter(r=>inYM(r,yr,mo)).reduce((s,r)=>s+r.distance,0);
    const lY=mo===1?yr-1:yr,lM=mo===1?12:mo-1;
    const lastMo=filtered.filter(r=>inYM(r,lY,lM)).reduce((s,r)=>s+r.distance,0);
    const dys=[...new Set(filtered.map(r=>r.date))].sort();
    let best=0,cur=0,prev=null;
    dys.forEach(d=>{const diff=prev?Math.round((new Date(d)-new Date(prev))/86400000):null;cur=diff===1?cur+1:1;best=Math.max(best,cur);prev=d;});
    const arrow=thisMo>lastMo?' <span style="color:var(--green)">▲</span>':(thisMo<lastMo?' <span style="color:var(--red)">▼</span>':'');
    const ps=document.createElement('div');ps.className='pstats';
    ps.innerHTML=`
      <div class="pstat">최장<b>${fmtKm(longest)}km</b></div>
      <div class="pstat">평균<b>${fmtKm(avg)}km</b></div>
      <div class="pstat">이번 달<b>${fmtKm(thisMo)}km${arrow}</b></div>
      <div class="pstat">최長 연속<b>${best}일</b></div>`;
    list.appendChild(ps);
  }
  // 스크롤 목록 (전부 표시 · 높이 고정 · 월별 구분 · 특별 배지)
  const scroll=document.createElement('div');scroll.className='reclist';
  if(!filtered.length){ scroll.appendChild(el(`<div class="empty">기록이 없어요. 위에서 러닝을 추가해 보세요!</div>`)); }
  else{
    let curM='';
    filtered.forEach(r=>{
      const ym=r.date.slice(0,7);
      if(ym!==curM){ curM=ym; const[yy,mm2]=ym.split('-'); scroll.appendChild(el(`<div class="rmonth">${Number(yy)}년 ${Number(mm2)}월</div>`)); }
      const m=member(r.memberId);const c=colorOf(r.memberId);
      const kmchip=r.distance>=unitOf(r.memberId)?`<span class="chip g" style="font-size:10px">${unitOf(r.memberId)}km+</span>`:'';
      const badge=r.distance>=21?'<span class="chip badge">🏅 하프</span>':(r.distance>=10?'<span class="chip badge">🔟</span>':'');
      const item=document.createElement('div');item.className='item';
      item.innerHTML=`
        <span class="dot" style="background:${c}">${m?initial(m.name):'?'}</span>
        <div class="meta">
          <div class="t">${m?m.name:'(삭제됨)'} ${kmchip}${badge}</div>
          <div class="s">${fmtDate(r.date)}${r.memo?' · '+r.memo:''}</div>
        </div>
        <span class="amt">+${fmtKm(r.distance)}km</span>
        <button class="del edit">수정</button>
        <button class="del">삭제</button>`;
      item.querySelector('.edit').onclick=()=>{editId=r.id;render();};
      item.querySelector('.del:not(.edit)').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){state.runs=state.runs.filter(x=>x.id!==r.id);save();render();toast('삭제했어요');}};
      scroll.appendChild(item);
    });
  }
  list.appendChild(scroll);
  v.appendChild(list);
}

function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}

/* ===== 러닝 달력 ===== */
function renderCalendar(v){
  const now=new Date();
  if(!calYM) calYM={y:now.getFullYear(), m:now.getMonth()+1};
  const {y,m}=calYM;
  const pad2=n=>String(n).padStart(2,'0');
  const startDow=new Date(y,m-1,1).getDay();   // 0=일
  const days=new Date(y,m,0).getDate();
  const calSrc = recentFilter==='all' ? state.runs : state.runs.filter(r=>r.memberId===recentFilter); // 선택 인원 연동
  const byDate={};
  calSrc.forEach(r=>{(byDate[r.date]=byDate[r.date]||[]).push(r);});
  const ranDays=Object.keys(byDate).filter(k=>k.startsWith(`${y}-${pad2(m)}`)).length;
  const tStr=todayStr();

  const W=['일','월','화','수','목','금','토'];
  let grid=W.map((w,i)=>`<div class="cal-w" style="color:${i===0?'var(--red)':i===6?'var(--brand)':'var(--muted)'}">${w}</div>`).join('');
  for(let i=0;i<startDow;i++) grid+=`<div class="cal-d pad"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${pad2(m)}-${pad2(d)}`;
    const runs=byDate[ds]||[];
    const dow=(startDow+d-1)%7;
    const col=dow===0?'var(--red)':dow===6?'var(--brand)':'var(--ink)';
    const dots=[...new Set(runs.map(r=>r.memberId))].slice(0,4)
      .map(id=>`<span style="width:5px;height:5px;border-radius:50%;background:${colorOf(id)};display:inline-block"></span>`).join('');
    grid+=`<div class="cal-d ${runs.length?'on':''} ${ds===tStr?'today':''} ${calSel===ds?'sel':''}" data-d="${runs.length?ds:''}" style="color:${col}">
      <span>${d}</span>${runs.length?`<span class="dots">${dots}</span>`:''}</div>`;
  }

  const card=document.createElement('div');card.className='glass card';
  card.innerHTML=`
    <h2 class="sec">📆 러닝 달력 ${recentFilter!=='all'?`<span class="r" style="color:${colorOf(recentFilter)};font-weight:700">${(member(recentFilter)||{}).name||''}</span>`:''}</h2>
    <div class="cal-head">
      <button class="cal-nav" id="cal_prev">‹</button>
      <div class="cal-title">${y}년 ${m}월 <span class="muted" style="font-weight:400">· ${ranDays}일 달림</span></div>
      <button class="cal-nav" id="cal_next">›</button>
    </div>
    <div class="cal-grid">${grid}</div>
    <div id="cal_detail"></div>`;
  v.appendChild(card);

  card.querySelector('#cal_prev').onclick=()=>{calYM={y:m===1?y-1:y,m:m===1?12:m-1};calSel=null;render();};
  card.querySelector('#cal_next').onclick=()=>{calYM={y:m===12?y+1:y,m:m===12?1:m+1};calSel=null;render();};
  card.querySelectorAll('.cal-d.on').forEach(c=>{c.onclick=()=>{const d=c.getAttribute('data-d');calSel=(calSel===d?null:d);render();};});

  if(calSel && byDate[calSel]){
    const det=card.querySelector('#cal_detail');
    det.innerHTML=`<div style="margin:14px 0 4px;font-weight:800;font-size:13.5px;color:var(--brand)">${fmtDate(calSel)} 기록</div>`;
    byDate[calSel].forEach(r=>{
      const mm=member(r.memberId);
      const item=document.createElement('div');item.className='item';
      const badge=r.distance>=21?'<span class="chip badge">🏅 하프</span>':(r.distance>=10?'<span class="chip badge">🔟</span>':'');
      item.innerHTML=`<span class="dot" style="background:${colorOf(r.memberId)}">${mm?initial(mm.name):'?'}</span>
        <div class="meta"><div class="t">${mm?mm.name:'(삭제됨)'} ${r.distance>=unitOf(r.memberId)?`<span class="chip g" style="font-size:10px">${unitOf(r.memberId)}km+</span>`:''}${badge}</div>
        <div class="s">${r.memo||'&nbsp;'}</div></div>
        <span class="amt">+${fmtKm(r.distance)}km</span>
        <button class="del edit">수정</button><button class="del">삭제</button>`;
      item.querySelector('.edit').onclick=()=>{editId=r.id;render();};
      item.querySelector('.del:not(.edit)').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){state.runs=state.runs.filter(x=>x.id!==r.id);save();render();toast('삭제했어요');}};
      det.appendChild(item);
    });
  }
}

/* ===== 용돈 ===== */
function renderAllowance(v){
  const kids=state.members.filter(m=>m.child);
  const card=document.createElement('div');card.className='glass card';
  card.innerHTML=`<h2 class="sec">💰 아이 용돈 <span class="r">${RUNS_PER_PAY}회 달성마다 ${fmtWon(PAY_AMOUNT)}</span></h2>`;
  let totalOut=0;
  kids.forEach(m=>{
    const unit=unitOf(m.id);
    const qual=state.runs.filter(r=>r.memberId===m.id&&r.distance>=unit).length;
    const earned=Math.floor(qual/RUNS_PER_PAY)*PAY_AMOUNT;
    const paid=(state.payouts[m.id]||0)*PAY_AMOUNT;
    const out=earned-paid; totalOut+=out;
    const toward=qual%RUNS_PER_PAY;
    const c=colorOf(m.id);
    const box=document.createElement('div');box.className='allow';
    box.innerHTML=`
      <div class="allow-top">
        <div class="allow-name"><span class="init" style="width:30px;height:30px;border-radius:10px;font-size:13px;background:${c}">${initial(m.name)}</span>${m.name}</div>
        <div>${out>0?`<span class="chip a">미지급 ${fmtWon(out)}</span>`:(earned>0?`<span class="chip g">정산 완료</span>`:`<span class="chip" style="background:rgba(120,130,150,.15);color:var(--muted)">진행 중</span>`)}</div>
      </div>
      <div class="muted">다음 ${fmtWon(PAY_AMOUNT)}까지 <b style="color:${c}">${toward}/${RUNS_PER_PAY}회</b></div>
      <div class="prog"><i style="width:${(toward/RUNS_PER_PAY)*100}%;background:${c}"></i></div>
      <div class="astats">
        <span>${unit}km+ 러닝 <b>${qual}회</b></span>
        <span>적립 <b>${fmtWon(earned)}</b></span>
        <span>지급 <b>${fmtWon(paid)}</b></span>
        <span>미지급 <b style="color:${out>0?'var(--amber-tx)':'inherit'}">${fmtWon(out)}</b></span>
      </div>
      <div class="aact">
        <button class="btn btn-sm btn-blue" data-pay ${out>0?'':'disabled style="opacity:.45"'}>1만원 지급 처리</button>
        ${(state.payouts[m.id]||0)>0?`<button class="btn btn-sm btn-soft" data-undo>지급 취소</button>`:''}
      </div>`;
    const pay=box.querySelector('[data-pay]');
    if(pay&&out>0) pay.onclick=()=>{state.payouts[m.id]=(state.payouts[m.id]||0)+1;save();render();toast(`${m.name} ${fmtWon(PAY_AMOUNT)} 지급 처리`);};
    const undo=box.querySelector('[data-undo]');
    if(undo) undo.onclick=()=>{state.payouts[m.id]=Math.max(0,(state.payouts[m.id]||0)-1);save();render();toast('지급 1건 취소');};
    card.appendChild(box);
  });
  const sum=document.createElement('div');
  sum.style.cssText='text-align:right;font-size:12.5px;color:var(--muted);margin-top:2px';
  sum.innerHTML=`현재 미지급 합계 <b style="color:var(--amber-tx);font-size:15px">${fmtWon(totalOut)}</b>`;
  card.appendChild(sum);
  v.appendChild(card);
}

/* ===== 일반 액티비티 ===== */
function renderGeneric(act){
  const v=document.getElementById('view');v.innerHTML='';
  if(!state.generic[act.id]) state.generic[act.id]=[];
  const recs=state.generic[act.id];
  const now=new Date(),yr=now.getFullYear(),mo=now.getMonth()+1;
  const yCount=recs.filter(r=>Number(r.date.split('-')[0])===yr).length;
  const mCount=recs.filter(r=>{const[y,m]=r.date.split('-').map(Number);return y===yr&&m===mo;}).length;

  const form=document.createElement('div');form.className='glass card';
  form.innerHTML=`
    <h2 class="sec">✍️ ${act.name} 기록 추가 <button class="del" id="rm_act" style="margin-left:auto">메뉴 삭제</button></h2>
    <div class="row3">
      <div><label>날짜</label><input type="date" id="g_date" value="${todayStr()}"></div>
      <div><label>누가</label><select id="g_member">${state.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
    </div>
    <div class="full"><label>값 (선택, 숫자)</label><input type="number" inputmode="decimal" id="g_val" step="0.1" placeholder="예: 시간·횟수"></div>
    <div class="full"><label>메모 (선택)</label><input type="text" id="g_memo" placeholder="내용을 적어주세요"></div>
    <button class="btn" id="g_add">기록 추가하기</button>`;
  v.appendChild(form);
  form.querySelector('#rm_act').onclick=()=>{
    if(confirm(`'${act.name}' 메뉴와 기록을 모두 삭제할까요?`)){
      state.activities=state.activities.filter(a=>a.id!==act.id);
      delete state.generic[act.id];current='running';save();render();toast('메뉴를 삭제했어요');
    }};
  form.querySelector('#g_add').onclick=()=>{
    const date=form.querySelector('#g_date').value;
    const memberId=form.querySelector('#g_member').value;
    const val=parseFloat(form.querySelector('#g_val').value);
    const memo=form.querySelector('#g_memo').value.trim();
    if(!date){toast('날짜를 입력해 주세요');return;}
    recs.push({id:uid(),date,memberId,value:isNaN(val)?null:val,memo});
    save();render();toast('기록 완료!');
  };

  const stat=document.createElement('div');stat.className='glass card';
  stat.innerHTML=`<h2 class="sec">📊 ${act.name} 통계</h2>
    <div class="tiles">
      <div class="tile"><div class="n">${mCount}<span style="font-size:14px">회</span></div><div class="l">이번 달 횟수</div></div>
      <div class="tile blue"><div class="n">${yCount}<span style="font-size:14px">회</span></div><div class="l">올해 횟수</div></div>
      <div class="tile"><div class="n">${recs.length}<span style="font-size:14px">회</span></div><div class="l">전체 누적</div></div>
      <div class="tile gold"><div class="n">${state.members.filter(m=>recs.some(r=>r.memberId===m.id)).length}<span style="font-size:14px">명</span></div><div class="l">참여 인원</div></div>
    </div>`;
  v.appendChild(stat);

  const list=document.createElement('div');list.className='glass card';
  list.innerHTML=`<h2 class="sec">📅 ${act.name} 기록</h2>`;
  const sorted=[...recs].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,30);
  if(!sorted.length) list.appendChild(el(`<div class="empty">아직 기록이 없어요.</div>`));
  else sorted.forEach(r=>{
    const m=member(r.memberId);const c=colorOf(r.memberId);
    const item=document.createElement('div');item.className='item';
    item.innerHTML=`<span class="dot" style="background:${c}">${m?initial(m.name):'?'}</span>
      <div class="meta"><div class="t">${m?m.name:'(삭제됨)'}${r.value!=null?' · '+r.value:''}</div>
      <div class="s">${fmtDate(r.date)}${r.memo?' · '+r.memo:''}</div></div>
      <button class="del">삭제</button>`;
    item.querySelector('.del').onclick=()=>{if(confirm('삭제할까요?')){state.generic[act.id]=recs.filter(x=>x.id!==r.id);save();render();}};
    list.appendChild(item);
  });
  v.appendChild(list);
}

// 맨 위로 버튼: 스크롤 내리면 나타나고, 누르면 부드럽게 맨 위로
const _gotop=document.getElementById('gotop');
if(_gotop){
  window.addEventListener('scroll',()=>{_gotop.classList.toggle('show',window.scrollY>380);},{passive:true});
  _gotop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
}

// 앱 설치(PWA)용 서비스워커 등록
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }

init();
</script>
